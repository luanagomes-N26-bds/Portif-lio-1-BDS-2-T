<!DOCTYPE html> <!--- indica a linguagem de progaramação a ser utilizada, nesse caso,o HTML. Deve ser a primeira linha do projeto.-->
<html lang="pt-br"> <!--abertur do documento, todas as tag\codigos devem ser escritas nesse espaço.-->
<head><!-- abertura da tag que define o cabeçalho do documento. o conteudo inserido nesse espaço não é visível no navegador, mas contém instruções sobre seu conteudo e comportamento. dentro dessa tag,podem ser escritas folhas de estilo de script.-->
    <meta charset="UTF-8"> <!-- especifica qual o conjunto de caracteres (character set ou charset) será usado pada renderizar o texto da página. UTF-8 contém todos os caracteres dos padrões -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head><!--fechamento da tag do cabeçalho.-->
<body>
    <!--um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como no caso da tag meta. Outro aspecto importante da linguagem é que ela é cas insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas, sendo assim, as tags podem ser escritas das duas maneiras.-->
<!--No HTML há seis níveis de cabeçalhos\títulos que podem ser usados por meio das tags h1, h2, h3, h4, h5 e h6, sendo o h1 o mais relevante e o h6 o menor\menos relevante.-->
<h1> matemática</h1>
</body>
</html><!--fechamento do documento.-->
